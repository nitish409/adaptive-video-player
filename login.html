<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - StreamFlix</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/remote.css">
</head>
<body>
  <header id="site-navbar"></header>

  <div class="auth-page-wrapper">
    <div class="auth-backdrop-tint"></div>

    <div class="auth-card">
      <h2 class="auth-title">Sign In</h2>

      <form class="auth-form" id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email or GLA Student ID</label>
          <input type="text" id="login-email" class="form-input" placeholder="e.g. nitish.rawat@gla.ac.in" required value="nitish.rawat@gla.ac.in" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter password" required value="streamflix2026" />
        </div>

        <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:#aaa; margin-top:4px;">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" checked /> Remember me
          </label>
          <a href="javascript:void(0)" onclick="showToast('Password reset link sent to demo mail.', 'info')" style="color:#aaa;">Need help?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="padding:14px; margin-top:12px; font-size:1.05rem;">
          Sign In
        </button>
      </form>

      <div style="margin-top: 24px; font-size: 0.95rem; color: #888;">
        New to StreamFlix? <a href="signup.html" style="color: #fff; font-weight: bold; text-decoration: underline;">Sign up now</a>.
      </div>

      <!-- Quick Demo Login Presets -->
      <div class="demo-credentials-box">
        <strong style="color:#fff; display:block; margin-bottom:6px;">🚀 Quick Demo Profile Login:</strong>
        <p style="margin-bottom:8px;">Switch instantly into any team member profile:</p>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <button class="badge badge-gray" onclick="fillLogin('Nitish Kumar Rawat', '2415001062')">Nitish</button>
          <button class="badge badge-gray" onclick="fillLogin('Pallavit Yadav', '2415001085')">Pallavit</button>
          <button class="badge badge-gray" onclick="fillLogin('Prabhanshu Thakur', '2415001118')">Prabhanshu</button>
          <button class="badge badge-gray" onclick="fillLogin('Piyush Kumar Yadav', '2415001112')">Piyush</button>
          <button class="badge badge-gray" onclick="fillLogin('Prince', '2415001182')">Prince</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-content">
      <div class="footer-bottom">
        <p class="footer-univ">GLA University • Mini Project - 1 • Section AE, Batch 8 • Piyush Kumar Yadav (2415001112)</p>
        <p>&copy; 2026 StreamFlix.</p>
      </div>
    </div>
  </footer>

  <script src="js/catalog.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/remote.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('login');

      const form = document.getElementById('login-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        showToast('Login successful! Redirecting to StreamFlix...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      });
    });

    function fillLogin(name, rollNo) {
      document.getElementById('login-email').value = `${name.toLowerCase().replace(/\s+/g, '.')}@gla.ac.in`;
      const profile = getUserProfile();
      profile.name = name;
      profile.rollNo = rollNo;
      saveUserProfile(profile);
      showToast(`Switched demo user to ${name} (${rollNo})`, 'info');
    }
  </script>
</body>
</html>
